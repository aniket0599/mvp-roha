<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-background": "#1c1b1b",
                        "tertiary-container": "#42423d",
                        "inverse-primary": "#b0cdbb",
                        "surface-dim": "#dcd9d9",
                        "surface-tint": "#496455",
                        "on-primary": "#ffffff",
                        "secondary-container": "#fe9572",
                        "surface-variant": "#e5e2e1",
                        "surface-container-highest": "#e5e2e1",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "primary-container": "#2d4739",
                        "background": "#fcf9f8",
                        "on-secondary-fixed": "#390b00",
                        "on-primary-container": "#98b5a3",
                        "secondary-fixed": "#ffdbd0",
                        "error-container": "#ffdad6",
                        "surface-bright": "#fcf9f8",
                        "on-error": "#ffffff",
                        "primary": "#173124",
                        "on-surface": "#1c1b1b",
                        "primary-fixed-dim": "#b0cdbb",
                        "surface-container": "#f0eded",
                        "on-primary-fixed": "#062014",
                        "on-tertiary-container": "#b0aea8",
                        "on-secondary-container": "#762c12",
                        "on-tertiary-fixed-variant": "#474742",
                        "outline": "#727973",
                        "on-primary-fixed-variant": "#324c3e",
                        "surface": "#fcf9f8",
                        "tertiary-fixed": "#e5e2db",
                        "tertiary-fixed-dim": "#c9c6c0",
                        "on-tertiary-fixed": "#1c1c18",
                        "surface-container-low": "#f6f3f2",
                        "on-surface-variant": "#424844",
                        "primary-fixed": "#ccead6",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#ffb59e",
                        "inverse-surface": "#313030",
                        "error": "#ba1a1a",
                        "secondary": "#99462a",
                        "inverse-on-surface": "#f3f0ef",
                        "tertiary": "#2c2c28",
                        "surface-container-high": "#eae7e7",
                        "outline-variant": "#c2c8c2",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#7a2f15"
                    },
                    borderRadius: {
                        DEFAULT: "0.125rem",
                        lg: "0.25rem",
                        xl: "0.5rem",
                        full: "0.75rem"
                    },
                    spacing: {
                        gutter: "24px",
                        "stack-lg": "48px",
                        "stack-sm": "12px",
                        "stack-md": "24px",
                        unit: "8px",
                        "margin-desktop": "40px",
                        "margin-mobile": "20px",
                        "container-max": "1200px"
                    },
                    fontFamily: {
                        "label-caps": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "headline-md": ["Playfair Display"],
                        "display-lg-mobile": ["Playfair Display"],
                        "body-md": ["Hanken Grotesk"],
                        "display-lg": ["Playfair Display"],
                        "label-md": ["Hanken Grotesk"]
                    },
                    fontSize: {
                        "label-caps": ["12px", { lineHeight: "1", letterSpacing: "0.1em", fontWeight: "600" }],
                        "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
                        "headline-md": ["24px", { lineHeight: "1.3", fontWeight: "600" }],
                        "display-lg-mobile": ["32px", { lineHeight: "1.2", fontWeight: "700" }],
                        "body-md": ["16px", { lineHeight: "1.5", fontWeight: "400" }],
                        "display-lg": ["48px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "label-md": ["14px", { lineHeight: "1.4", fontWeight: "500" }]
                    }
                }
            }
        };
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .chip-active {
            background-color: var(--tw-colors-primary);
            color: var(--tw-colors-on-primary);
            border-color: var(--tw-colors-primary);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Transactional, no shell nav for profile creation setup) -->
<header class="bg-background dark:bg-background flex items-center w-full px-margin-mobile md:px-margin-desktop py-stack-sm sticky top-0 z-40">
<button class="text-primary dark:text-primary-fixed hover:bg-surface-container dark:hover:bg-tertiary-container transition-colors rounded-full p-2 mr-4 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-headline-md font-headline-md text-primary dark:text-on-primary-fixed">Profile Setup</h1>
</header>
<!-- Main Content -->
<main class="flex-grow w-full max-w-[800px] mx-auto px-margin-mobile md:px-margin-desktop py-stack-md flex flex-col gap-stack-lg pb-32">
<header class="mb-stack-md">
<h2 class="text-display-lg-mobile md:text-display-lg font-display-lg-mobile md:font-display-lg text-on-surface mb-2">Create your social profile.</h2>
<p class="text-body-lg font-body-lg text-on-surface-variant">Introduce yourself to the community. Be genuine, be curious.</p>
</header>
<form class="flex flex-col gap-stack-lg">
<!-- Basics Bento -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<div class="flex flex-col gap-2">
<label class="text-label-caps font-label-caps text-on-surface-variant uppercase" for="name">Name</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 text-body-lg font-body-lg text-on-surface transition-colors" id="name" placeholder="Your name" type="text" value="Aniket"/>
</div>
<div class="flex flex-col gap-2">
<label class="text-label-caps font-label-caps text-on-surface-variant uppercase" for="age">Age</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 text-body-lg font-body-lg text-on-surface transition-colors" id="age" placeholder="Your age" type="number" value="27"/>
</div>
</section>
<!-- Interests Chips -->
<section class="flex flex-col gap-4">
<label class="text-label-caps font-label-caps text-on-surface-variant uppercase">Interests</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface text-label-md font-label-md hover:bg-surface-container transition-colors chip-active" type="button">Running</button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface text-label-md font-label-md hover:bg-surface-container transition-colors chip-active" type="button">Startups</button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface text-label-md font-label-md hover:bg-surface-container transition-colors chip-active" type="button">Travel</button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface text-label-md font-label-md hover:bg-surface-container transition-colors chip-active" type="button">Philosophy</button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface text-label-md font-label-md hover:bg-surface-container transition-colors chip-active" type="button">Technology</button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface text-label-md font-label-md hover:bg-surface-container transition-colors" type="button"><span class="material-symbols-outlined text-[16px] mr-1 align-text-bottom" data-icon="add">add</span>Add More</button>
</div>
</section>
<!-- Current Status -->
<section class="flex flex-col gap-4">
<label class="text-label-caps font-label-caps text-on-surface-variant uppercase">What are you currently doing?</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 text-body-lg font-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors cursor-pointer">
<option value="building">Building something</option>
<option value="working">Working professionally</option>
<option value="studying">Studying</option>
<option value="exploring">Exploring options</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="expand_more">expand_more</span>
</div>
</div>
</section>
<!-- Textareas -->
<section class="flex flex-col gap-stack-md">
<div class="flex flex-col gap-2">
<label class="text-label-caps font-label-caps text-on-surface-variant uppercase" for="interesting">Tell people something interesting</label>
<textarea class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-4 text-body-lg font-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary resize-none transition-colors" id="interesting" rows="3">Started running 6 months ago and still struggle with long runs. Getting there.</textarea>
</div>
<div class="flex flex-col gap-2">
<label class="text-label-caps font-label-caps text-on-surface-variant uppercase" for="askme">Ask me about...</label>
<textarea class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-4 text-body-lg font-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary resize-none transition-colors" id="askme" rows="3">Japan travel recommendations, HYROX, sociology and the weird effects technology has on people.</textarea>
</div>
</section>
<!-- Looking For -->
<section class="flex flex-col gap-4">
<label class="text-label-caps font-label-caps text-on-surface-variant uppercase">Looking for</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface text-label-md font-label-md hover:bg-surface-container transition-colors chip-active" type="button">Interesting conversations</button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface text-label-md font-label-md hover:bg-surface-container transition-colors chip-active" type="button">Running partner</button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface text-label-md font-label-md hover:bg-surface-container transition-colors" type="button">Mentorship</button>
</div>
</section>
<!-- Social Availability -->
<section class="flex flex-col gap-4 bg-surface-container-lowest p-6 rounded-xl border border-outline-variant">
<label class="text-label-caps font-label-caps text-on-surface-variant uppercase mb-2">Social availability</label>
<label class="flex items-center gap-4 cursor-pointer group">
<input checked="" class="hidden peer" name="availability" type="radio" value="open"/>
<div class="w-5 h-5 rounded-full border-2 border-outline peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center transition-colors">
<div class="w-2 h-2 rounded-full bg-on-primary scale-0 peer-checked:scale-100 transition-transform"></div>
</div>
<span class="flex items-center gap-2 text-body-lg font-body-lg text-on-surface group-hover:text-primary transition-colors">
<span class="w-3 h-3 rounded-full bg-[#10B981]"></span> Open to meeting people
                    </span>
</label>
<label class="flex items-center gap-4 cursor-pointer group">
<input class="hidden peer" name="availability" type="radio" value="approached"/>
<div class="w-5 h-5 rounded-full border-2 border-outline peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center transition-colors">
<div class="w-2 h-2 rounded-full bg-on-primary scale-0 peer-checked:scale-100 transition-transform"></div>
</div>
<span class="flex items-center gap-2 text-body-lg font-body-lg text-on-surface group-hover:text-primary transition-colors">
<span class="w-3 h-3 rounded-full bg-[#F59E0B]"></span> Open if approached
                    </span>
</label>
<label class="flex items-center gap-4 cursor-pointer group">
<input class="hidden peer" name="availability" type="radio" value="solo"/>
<div class="w-5 h-5 rounded-full border-2 border-outline peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center transition-colors">
<div class="w-2 h-2 rounded-full bg-on-primary scale-0 peer-checked:scale-100 transition-transform"></div>
</div>
<span class="flex items-center gap-2 text-body-lg font-body-lg text-on-surface group-hover:text-primary transition-colors">
<span class="w-3 h-3 rounded-full border border-outline-variant bg-surface-variant"></span> Just here for myself
                    </span>
</label>
</section>
</form>
</main>
<!-- Sticky Footer Action -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md border-t border-outline-variant/30 py-4 px-margin-mobile md:px-margin-desktop z-50">
<div class="max-w-[800px] mx-auto flex justify-end">
<button class="h-[48px] px-8 bg-primary text-on-primary font-label-caps text-label-caps tracking-widest uppercase rounded hover:bg-primary-fixed-variant transition-colors flex items-center justify-center w-full md:w-auto shadow-sm" type="button">
                Finish Profile
            </button>
</div>
</div>
</body></html>
